---
- name: Deploy Log Analyzer Application
  hosts: appservers
  become: true

  tasks:

    - name: Install Python and pip
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/log-analyzer
        state: directory
        mode: '0755'

    - name: Install Flask
      ansible.builtin.pip:
        name: flask
        executable: pip3

    - name: Copy application
      ansible.builtin.copy:
        src: /root/log-analyzer/app/app.py
        dest: /opt/log-analyzer/app.py
        mode: '0644'

    - name: Copy sample log file
      ansible.builtin.copy:
        src: /root/log-analyzer/app/sample.log
        dest: /opt/log-analyzer/sample.log
        mode: '0644'

    - name: Create systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/log-analyzer.service
        mode: '0644'
        content: |
          [Unit]
          Description=Log Analyzer Flask Application
          After=network.target

          [Service]
          WorkingDirectory=/opt/log-analyzer
          ExecStart=/usr/bin/python3 /opt/log-analyzer/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Log Analyzer
      ansible.builtin.systemd:
        name: log-analyzer
        enabled: true
        state: started
